name: puckmesh
version: "0.1.0"
config-version: 2
profile: puckmesh
# Same range as dbt-core in requirements.txt.
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

vars:
  # HockeyTech's shot grid is 600 x 300 with a top-left origin, stretched over a regulation
  # 200 x 85 ft rink: the league's own shot chart draws that rink to scale. Same convention
  # as fastRhockey/sportsdataverse (docs/plans/rink-coordinates.md). The grid is stylized,
  # so feet are approximate: end-zone faceoff dots convert to ~67 and ~52 ft, not 69.
  rink_length_units: 600     # x runs 0-600 along the rink
  rink_width_units: 300      # y runs 0-300 across it
  rink_center_x: 300
  rink_length_ft: 200        # regulation rink
  rink_width_ft: 85
  rink_goal_line_ft: 89      # goal line from center ice (11 ft from the end boards)

  regulation_period_seconds: 1200   # 20 minutes; overtime counts from 3 x 1200
  # PWHL rulebook: regular-season overtime is five minutes of 3-on-3, then a shootout.
  # Playoff overtime is 20-minute periods until a goal.
  regular_season_overtime_seconds: 300

  # A shot this soon after the same team's previous unblocked shot counts as a rebound.
  rebound_window_seconds: 3

  # A venue is one of a team's home arenas in a season year if the team hosts at least this
  # many games there; a game anywhere else is at a neutral site (the league's Takeover Tour
  # games, one team listed as home). Counting games rather than taking the most-used arena
  # keeps a second home arena (a bigger one for big games) from being called neutral.
  # docs/plans/metrics.md, step 3: check against the league's Takeover Tour lists.
  neutral_site_min_home_games: 3

  # The xG model fct_shots publishes. Same value as MODEL_VERSION in ml/xg/model.py;
  # change both together.
  xg_model_version: v1.1

# Bronze is the raw catalog (raw.<league>.<endpoint>), loaded by extract/load.py
# and declared as dbt sources. dbt builds silver and gold only.
# Folders map to schemas. In dev these get your prefix (dev.dbt_apetry_silver);
# in prod they're used as-is (prod.silver). See macros/generate_schema_name.sql.
models:
  puckmesh:
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table
