name: puckmesh
version: "0.1.0"
config-version: 2
profile: puckmesh
# Same range as dbt-core in requirements.txt.
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

vars:
  # HockeyTech's shot grid is 600 x 300 and not drawn to scale. Goals cluster at x ~50
  # and ~550, so the goal lines are ~500 units apart; real goal lines are 178 ft apart.
  # Approximate; revisit when validating the xG model.
  rink_length_units: 600     # x runs 0-600 along the rink
  rink_width_units: 300      # y runs 0-300 across it
  rink_net_x: 550            # attacking net after normalizing every shot to attack right
  rink_center_x: 300
  rink_center_y: 150
  rink_units_per_foot: 2.81  # 500 units / 178 ft

  regulation_period_seconds: 1200   # 20 minutes; overtime counts from 3 x 1200

  # A shot this soon after the same team's previous unblocked shot counts as a rebound.
  rebound_window_seconds: 3

# Bronze is the raw catalog (raw.<league>.<endpoint>), loaded by extract/load.py
# and declared as dbt sources. dbt builds silver and gold only.
# Folders map to schemas. In dev these get your prefix (dev.dbt_apetry_silver);
# in prod they're used as-is (prod.silver). See macros/generate_schema_name.sql.
models:
  puckmesh:
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table
