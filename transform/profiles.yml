# Project-local profile: dbt reads profiles.yml from the working directory first,
# so run dbt from transform/. No secrets here; everything comes from the environment
# (load ../.env with: python -m dotenv -f ../.env run -- dbt build).
puckmesh:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') | trim('/') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: dev
      schema: "{{ env_var('DBT_SCHEMA') }}"
      threads: 4

    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') | trim('/') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: prod
      schema: default
      threads: 4
