  - name: int_finishing_priors_estimated_uses_method_of_moments
    description: >
      Forwards 1 and 2 both have 2.0 xG, with 4 and 0 goals: m = 1, sum((G - mX)^2) = 8,
      m * sum(X) = 4, sum(X^2) = 8, so tau^2 = 0.5 and prior_xg = 2. Defenders 3 and 4 score
      exactly their xG, and so do the goalies, so tau^2 is negative and prior_xg is null.
      A playoff shot, a blocked shot, an empty-net goal and an unscored goal are left out.
    model: int_finishing_priors_estimated
    given:
      - input: ref('int_shots_enriched')
        rows:
          - {league_id: pwhl, game_id: 1, event_index: 1, season_id: 1, shooter_player_id: 1,
             goalie_player_id: 9, shot_result: goal, is_empty_net: false}
          - {league_id: pwhl, game_id: 1, event_index: 2, season_id: 1, shooter_player_id: 1,
             goalie_player_id: 9, shot_result: goal, is_empty_net: false}
          - {league_id: pwhl, game_id: 1, event_index: 3, season_id: 1, shooter_player_id: 1,
             goalie_player_id: 9, shot_result: goal, is_empty_net: false}
          - {league_id: pwhl, game_id: 1, event_index: 4, season_id: 1, shooter_player_id: 1,
             goalie_player_id: 9, shot_result: goal, is_empty_net: false}
          - {league_id: pwhl, game_id: 1, event_index: 5, season_id: 1, shooter_player_id: 2,
             goalie_player_id: 9, shot_result: on_net, is_empty_net: false}
          - {league_id: pwhl, game_id: 1, event_index: 6, season_id: 1, shooter_player_id: 2,
             goalie_player_id: 9, shot_result: on_net, is_empty_net: false}
          - {league_id: pwhl, game_id: 1, event_index: 7, season_id: 1, shooter_player_id: 2,
             goalie_player_id: 9, shot_result: on_net, is_empty_net: false}
          - {league_id: pwhl, game_id: 1, event_index: 8, season_id: 1, shooter_player_id: 2,
             goalie_player_id: 9, shot_result: on_net, is_empty_net: false}
          - {league_id: pwhl, game_id: 2, event_index: 1, season_id: 1, shooter_player_id: 3,
             goalie_player_id: 8, shot_result: goal, is_empty_net: false}
          - {league_id: pwhl, game_id: 2, event_index: 2, season_id: 1, shooter_player_id: 3,
             goalie_player_id: 8, shot_result: on_net, is_empty_net: false}
          - {league_id: pwhl, game_id: 2, event_index: 3, season_id: 1, shooter_player_id: 4,
             goalie_player_id: 8, shot_result: goal, is_empty_net: false}
          - {league_id: pwhl, game_id: 2, event_index: 4, season_id: 1, shooter_player_id: 4,
             goalie_player_id: 8, shot_result: on_net, is_empty_net: false}
          # Left out: a playoff goal, a blocked shot, an empty-net goal, an unscored goal.
          - {league_id: pwhl, game_id: 3, event_index: 1, season_id: 2, shooter_player_id: 1,
             goalie_player_id: 8, shot_result: goal, is_empty_net: false}
          - {league_id: pwhl, game_id: 1, event_index: 9, season_id: 1, shooter_player_id: 1,
             goalie_player_id: null, shot_result: blocked, is_empty_net: false}
          - {league_id: pwhl, game_id: 1, event_index: 10, season_id: 1, shooter_player_id: 2,
             goalie_player_id: 9, shot_result: goal, is_empty_net: true}
          - {league_id: pwhl, game_id: 1, event_index: 11, season_id: 1, shooter_player_id: 2,
             goalie_player_id: 9, shot_result: goal, is_empty_net: false}
      - input: ref('stg_ml__xg_predictions')
        rows:
          - {game_id: 1, event_index: 1, xg: 0.5}
          - {game_id: 1, event_index: 2, xg: 0.5}
          - {game_id: 1, event_index: 3, xg: 0.5}
          - {game_id: 1, event_index: 4, xg: 0.5}
          - {game_id: 1, event_index: 5, xg: 0.5}
          - {game_id: 1, event_index: 6, xg: 0.5}
          - {game_id: 1, event_index: 7, xg: 0.5}
          - {game_id: 1, event_index: 8, xg: 0.5}
          - {game_id: 2, event_index: 1, xg: 0.5}
          - {game_id: 2, event_index: 2, xg: 0.5}
          - {game_id: 2, event_index: 3, xg: 0.5}
          - {game_id: 2, event_index: 4, xg: 0.5}
          - {game_id: 3, event_index: 1, xg: 0.5}
          - {game_id: 1, event_index: 9, xg: 0.5}
          - {game_id: 1, event_index: 10, xg: 0.5}
      - input: ref('stg_pwhl__seasons')
        rows:
          - {season_id: 1, season_type: regular}
          - {season_id: 2, season_type: playoffs}
      - input: ref('stg_pwhl__roster_players')
        rows:
          - {player_id: 1, season_id: 1, team_id: 10, position_group: F}
          - {player_id: 2, season_id: 1, team_id: 10, position_group: F}
          - {player_id: 3, season_id: 1, team_id: 20, position_group: D}
          - {player_id: 4, season_id: 1, team_id: 20, position_group: D}
    expect:
      # Goalies: 9 faced 4.0 xG and allowed 4, 8 faced 2.0 and allowed 2, so m = 1,
      # sum((G - mX)^2) = 0, m * sum(X) = 6, sum(X^2) = 20: tau^2 = -0.3.
      rows:
        - {prior_group: F, player_seasons: 2, prior_goals_per_xg: 1.0, skill_variance: 0.5,
           prior_xg: 2.0}
        - {prior_group: D, player_seasons: 2, prior_goals_per_xg: 1.0, skill_variance: -1.0,
           prior_xg: null}
        - {prior_group: G, player_seasons: 2, prior_goals_per_xg: 1.0, skill_variance: -0.3,
           prior_xg: null}

  - name: int_score_venue_weights_estimated_mirrors_and_averages
    description: >
      Home share of shot attempts: tied 1 of 2 (0.5), home up 1 1 of 4 (0.25), home down 1
      2 of 4 (0.5). An away team up 1 is the home team down 1, so its expected share is
      1 - 0.5 = 0.5; a neutral team up 1 averages 0.25 and 0.5. Shots from a neutral-site
      game and a preseason game are left out. Every shot is on a power play, so there are
      no ev rows.
    model: int_score_venue_weights_estimated
    given:
      - input: ref('int_shots_enriched')
        rows:
          - {game_id: 1, event_index: 1, season_id: 1, is_home_team: true, score_diff: 0,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
          - {game_id: 1, event_index: 2, season_id: 1, is_home_team: false, score_diff: 0,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
          - {game_id: 1, event_index: 3, season_id: 1, is_home_team: true, score_diff: 1,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
          - {game_id: 1, event_index: 4, season_id: 1, is_home_team: false, score_diff: -1,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
          - {game_id: 1, event_index: 5, season_id: 1, is_home_team: false, score_diff: -1,
             strength_group: pp, shot_result: blocked, is_quality_chance: false}
          - {game_id: 1, event_index: 6, season_id: 1, is_home_team: false, score_diff: -1,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
          - {game_id: 1, event_index: 7, season_id: 1, is_home_team: true, score_diff: -1,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
          - {game_id: 1, event_index: 8, season_id: 1, is_home_team: true, score_diff: -1,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
          - {game_id: 1, event_index: 9, season_id: 1, is_home_team: false, score_diff: 1,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
          - {game_id: 1, event_index: 10, season_id: 1, is_home_team: false, score_diff: 1,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
          # Left out: a neutral-site game and a preseason game.
          - {game_id: 2, event_index: 1, season_id: 1, is_home_team: true, score_diff: 0,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
          - {game_id: 2, event_index: 2, season_id: 1, is_home_team: true, score_diff: 0,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
          - {game_id: 3, event_index: 1, season_id: 2, is_home_team: true, score_diff: 0,
             strength_group: pp, shot_result: on_net, is_quality_chance: false}
      - input: ref('stg_ml__xg_predictions')
        rows: []
      - input: ref('stg_pwhl__seasons')
        rows:
          - {season_id: 1, season_type: regular}
          - {season_id: 2, season_type: preseason}
      - input: ref('int_game_venues_classified')
        rows:
          - {game_id: 1, is_neutral_site: false}
          - {game_id: 2, is_neutral_site: true}
          - {game_id: 3, is_neutral_site: false}
    expect:
      rows:
        - {situation: all, shooter_venue: home, score_state: -1,
           expected_share_shot_attempts: 0.5, weight_shot_attempts: 1.0}
        - {situation: all, shooter_venue: home, score_state: 0,
           expected_share_shot_attempts: 0.5, weight_shot_attempts: 1.0}
        - {situation: all, shooter_venue: home, score_state: 1,
           expected_share_shot_attempts: 0.25, weight_shot_attempts: 2.0}
        - {situation: all, shooter_venue: away, score_state: -1,
           expected_share_shot_attempts: 0.75, weight_shot_attempts: 0.6666666666666666}
        - {situation: all, shooter_venue: away, score_state: 0,
           expected_share_shot_attempts: 0.5, weight_shot_attempts: 1.0}
        - {situation: all, shooter_venue: away, score_state: 1,
           expected_share_shot_attempts: 0.5, weight_shot_attempts: 1.0}
        - {situation: all, shooter_venue: neutral, score_state: -1,
           expected_share_shot_attempts: 0.625, weight_shot_attempts: 0.8}
        - {situation: all, shooter_venue: neutral, score_state: 0,
           expected_share_shot_attempts: 0.5, weight_shot_attempts: 1.0}
        - {situation: all, shooter_venue: neutral, score_state: 1,
           expected_share_shot_attempts: 0.375, weight_shot_attempts: 1.3333333333333333}

  - name: int_strength_intervals_derived_times_penalties
    description: >
      A regular-season game won in overtime at 3700. An away minor ended early by a
      power-play goal at 130; two overlapping home minors give the away team a 5-on-3 from
      550 to 620; coincidental minors give 4-on-4; overtime is 3-on-3 from 3600 until an away
      penalty at 3650 gives the home team 4v3, cut off by the winning goal at 3700.
    model: int_strength_intervals_derived
    given:
      - input: ref('stg_pwhl__games')
        rows:
          - {league_id: pwhl, game_id: 1, season_id: 1, home_team_id: 10, away_team_id: 20,
             is_final: true}
      - input: ref('stg_pwhl__seasons')
        rows:
          - {season_id: 1, season_type: regular}
      - input: ref('int_penalties_timed')
        rows:
          - {game_id: 1, penalized_team_id: 20, start_game_seconds: 100,
             end_game_seconds: 220, ended_by_goal_event_index: 12}
          - {game_id: 1, penalized_team_id: 10, start_game_seconds: 500,
             end_game_seconds: 620, ended_by_goal_event_index: null}
          - {game_id: 1, penalized_team_id: 10, start_game_seconds: 550,
             end_game_seconds: 670, ended_by_goal_event_index: null}
          - {game_id: 1, penalized_team_id: 10, start_game_seconds: 1000,
             end_game_seconds: 1120, ended_by_goal_event_index: null}
          - {game_id: 1, penalized_team_id: 20, start_game_seconds: 1000,
             end_game_seconds: 1120, ended_by_goal_event_index: null}
          - {game_id: 1, penalized_team_id: 20, start_game_seconds: 3650,
             end_game_seconds: 3770, ended_by_goal_event_index: null}
      - input: ref('stg_pwhl__goals')
        rows:
          - {game_id: 1, event_index: 12, period: 1, game_seconds: 130}
          - {game_id: 1, event_index: 90, period: 4, game_seconds: 3700}
      - input: ref('stg_pwhl__shootout_attempts')
        rows: []
    expect:
      rows:
        - {start_game_seconds: 0, end_game_seconds: 100, home_skaters: 5, away_skaters: 5}
        - {start_game_seconds: 100, end_game_seconds: 130, home_skaters: 5, away_skaters: 4}
        - {start_game_seconds: 130, end_game_seconds: 500, home_skaters: 5, away_skaters: 5}
        - {start_game_seconds: 500, end_game_seconds: 550, home_skaters: 4, away_skaters: 5}
        - {start_game_seconds: 550, end_game_seconds: 620, home_skaters: 3, away_skaters: 5}
        - {start_game_seconds: 620, end_game_seconds: 670, home_skaters: 4, away_skaters: 5}
        - {start_game_seconds: 670, end_game_seconds: 1000, home_skaters: 5, away_skaters: 5}
        - {start_game_seconds: 1000, end_game_seconds: 1120, home_skaters: 4, away_skaters: 4}
        - {start_game_seconds: 1120, end_game_seconds: 3600, home_skaters: 5, away_skaters: 5}
        - {start_game_seconds: 3600, end_game_seconds: 3650, home_skaters: 3, away_skaters: 3}
        - {start_game_seconds: 3650, end_game_seconds: 3700, home_skaters: 4, away_skaters: 3}
