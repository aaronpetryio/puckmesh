version: 2

models:
  - name: int_shots_enriched
    description: >
      Shot attempts with xG context: position in feet from center ice, turned so every shot
      attacks the net at x = +rink_goal_line_ft, distance (ft) and angle to that net, score
      state before the shot, and time since the team's previous unblocked shot. Feet are
      approximate (see vars in dbt_project.yml).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, event_index]
    columns:
      - name: defending_team_id
        data_tests: [not_null]
      - name: x_ft
        description: Feet from center ice along the rink, toward the attacked net.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -100
                max_value: 100
      - name: y_ft
        description: Feet from center ice across the rink.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -42.5
                max_value: 42.5
      - name: distance_ft
        description: >
          Warns if a shot at a goalie is over 99 ft away. Shots at a goalie are measured to
          the nearer net, which is at most ~98.6 ft from anywhere on the rink, so a failure
          means the geometry is wrong. A warning while the convention is new.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 220
          - dbt_utils.accepted_range:
              name: int_shots_enriched_shots_at_goalie_within_99_ft
              arguments:
                min_value: 0
                max_value: 99
              config:
                where: "not is_empty_net"
                severity: warn
      - name: angle_deg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 180

unit_tests:
  - name: int_shots_enriched_measures_shots_in_feet
    description: >
      Turns shots toward the right-hand net and measures them in feet. Shots at a goalie go
      to the nearer net. Empty-net goals, flagged on the goal event even when the shot names
      a goalie, go to the end the team attacked that period, from its other shots, or
      home-attacks-left when it has none. Game 1 is drawn the usual
      way; game 2, period 1 has the ends swapped, as some periods are in the real data.
    model: int_shots_enriched
    given:
      - input: ref('stg_pwhl__shots')
        rows:
          # Away shot in the faceoff circle.
          - {game_id: 1, event_index: 1, period: 1, shooting_team_id: 20, is_home_team: false,
             goalie_player_id: 5, shot_result: on_net, x_location: 466, y_location: 269}
          # The same spot from the other end, by the home team.
          - {game_id: 1, event_index: 2, period: 1, shooting_team_id: 10, is_home_team: true,
             goalie_player_id: 6, shot_result: on_net, x_location: 134, y_location: 31}
          # From behind the net.
          - {game_id: 1, event_index: 3, period: 1, shooting_team_id: 20, is_home_team: false,
             goalie_player_id: 5, shot_result: on_net, x_location: 590, y_location: 120}
          # Center ice.
          - {game_id: 1, event_index: 4, period: 2, shooting_team_id: 20, is_home_team: false,
             goalie_player_id: 5, shot_result: on_net, x_location: 300, y_location: 150}
          # Home empty-net goal from its own half; no other home shots that period. The
          # shot still names the pulled goalie, as most real ones do.
          - {game_id: 1, event_index: 5, period: 3, shooting_team_id: 10, is_home_team: true,
             goalie_player_id: 5, shot_result: goal, goal_id: 501, x_location: 450,
             y_location: 149}
          # Swapped period: the home team's shots at a goalie are on the right...
          - {game_id: 2, event_index: 1, period: 1, shooting_team_id: 10, is_home_team: true,
             goalie_player_id: 5, shot_result: on_net, x_location: 500, y_location: 150}
          - {game_id: 2, event_index: 2, period: 1, shooting_team_id: 10, is_home_team: true,
             goalie_player_id: 5, shot_result: on_net, x_location: 520, y_location: 140}
          # ...so its empty-net goal from the left half goes to the right net.
          - {game_id: 2, event_index: 3, period: 1, shooting_team_id: 10, is_home_team: true,
             goalie_player_id: null, shot_result: goal, goal_id: 502, x_location: 150,
             y_location: 150}
      - input: ref('stg_pwhl__goals')
        rows:
          - {game_id: 1, event_index: 6, goal_id: 501, scoring_team_id: 10, is_empty_net: true}
          - {game_id: 2, event_index: 4, goal_id: 502, scoring_team_id: 10, is_empty_net: true}
      - input: ref('stg_pwhl__games')
        rows:
          - {game_id: 1, home_team_id: 10, away_team_id: 20}
          - {game_id: 2, home_team_id: 10, away_team_id: 20}
    expect:
      rows:
        - {game_id: 1, event_index: 1, is_empty_net: false,
           x_ft: 55.3, y_ft: -33.7, distance_ft: 47.6, angle_deg: 45.0}
        - {game_id: 1, event_index: 2, is_empty_net: false,
           x_ft: 55.3, y_ft: -33.7, distance_ft: 47.6, angle_deg: 45.0}
        - {game_id: 1, event_index: 3, is_empty_net: false,
           x_ft: 96.7, y_ft: 8.5, distance_ft: 11.4, angle_deg: 132.0}
        - {game_id: 1, event_index: 4, is_empty_net: false,
           x_ft: 0.0, y_ft: 0.0, distance_ft: 89.0, angle_deg: 0.0}
        - {game_id: 1, event_index: 5, is_empty_net: true,
           x_ft: -50.0, y_ft: -0.3, distance_ft: 139.0, angle_deg: 0.1}
        - {game_id: 2, event_index: 1, is_empty_net: false,
           x_ft: 66.7, y_ft: 0.0, distance_ft: 22.3, angle_deg: 0.0}
        - {game_id: 2, event_index: 2, is_empty_net: false,
           x_ft: 73.3, y_ft: 2.8, distance_ft: 15.9, angle_deg: 10.3}
        - {game_id: 2, event_index: 3, is_empty_net: true,
           x_ft: -50.0, y_ft: 0.0, distance_ft: 139.0, angle_deg: 0.0}
