version: 2

models:
  - name: int_penalties_timed
    description: >
      One row per penalty that takes a skater off the ice, with when it starts and ends. Rules
      (docs/plans/xg-model.md, step 2): minors with the pp flag count; coincidental minors
      give 4-on-4, unless a power-play penalty was called at the same moment, when they're
      replaced; majors and match penalties count unless the other team got one at the same
      moment (a fight); misconducts and penalty-shot penalties never count. A goal the league
      marks as a power-play goal ends the minor that started first among those the other team
      is serving; majors and coincidental minors run their full time. A double minor (two
      2-minute minors on one player at once) is served back to back. Approximations: a third
      penalty while two are in the box doesn't wait its turn; a third stacked minor starts
      with the second; a third power-play goal against three minors at once may leave one
      running; and when a double minor's second part and another minor are both running, a
      goal may end the other one first.
    columns:
      - name: penalty_id
        data_tests: [unique, not_null]
      - name: start_event_index
        description: The penalty covers events after this one.
        data_tests: [not_null]
      - name: start_game_seconds
        description: >
          And at or after this time: later than the call for a double minor's second part.
        data_tests: [not_null]
      - name: end_game_seconds
        description: When the penalty's time runs out, if no goal ends it first.
        data_tests: [not_null]
      - name: ended_by_goal_event_index
        description: The power-play goal that ended the penalty early. Null if none did.

  - name: int_shots_enriched
    description: >
      Shot attempts with xG context: position in feet from center ice, turned so every shot
      attacks the net at x = +rink_goal_line_ft, distance (ft) and angle to that net, score
      state before the shot, and time since the team's previous unblocked shot. Feet are
      approximate (see vars in dbt_project.yml).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, event_index]
    columns:
      - name: defending_team_id
        data_tests: [not_null]
      - name: x_ft
        description: Feet from center ice along the rink, toward the attacked net.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -100
                max_value: 100
      - name: y_ft
        description: Feet from center ice across the rink.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -42.5
                max_value: 42.5
      - name: distance_ft
        description: >
          Warns if a shot at a goalie is over 99 ft away. Shots at a goalie are measured to
          the nearer net, which is at most ~98.6 ft from anywhere on the rink, so a failure
          means the geometry is wrong. A warning while the convention is new.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 220
          - dbt_utils.accepted_range:
              name: int_shots_enriched_shots_at_goalie_within_99_ft
              arguments:
                min_value: 0
                max_value: 99
              config:
                where: "not is_empty_net"
                severity: warn
      - name: angle_deg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 180

  - name: int_game_venues_classified
    description: >
      One row per game, with whether it was played at a neutral site: a venue where the home
      team hosts fewer than neutral_site_min_home_games (3, in dbt_project.yml) games that
      season year, such as the league's Takeover Tour games. A season year is the year the
      season ends, covering preseason, regular season and playoffs. fct_games and the
      score-and-venue weights both read this, so the rule lives in one place.
    config:
      tags: [metrics]
    columns:
      - name: game_id
        data_tests: [unique, not_null]
      - name: home_games_at_venue
        description: Games the home team hosts at this venue in the season year.
      - name: is_neutral_site
        data_tests: [not_null]

  - name: int_score_venue_weights_estimated
    description: >
      One row per situation (all, ev), shooting team's venue (home, away, neutral) and its
      own score state (-2 to 2, leads of 2+ pooled): the league's expected share of each
      measure in that state, and the weight (0.5 / expected share) one event counts for in
      score-and-venue adjusted counts (McCurdy's method; docs/plans/metrics.md, step 3).
      Estimated on regular-season and playoff games, neutral sites left out; neutral rows
      average the home and away shares.
    config:
      tags: [metrics]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [situation, shooter_venue, score_state]
    columns:
      - name: situation
        data_tests:
          - accepted_values:
              arguments:
                values: [all, ev]
      - name: shooter_venue
        data_tests:
          - accepted_values:
              arguments:
                values: [home, away, neutral]
      - name: expected_share_shot_attempts
        description: Shots on goal + blocked. The feed has no missed shots.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: false
      - name: expected_share_xg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: false
      - name: weight_shot_attempts
        data_tests: [not_null]

  - name: int_strength_intervals_derived
    description: >
      One row per final game per stretch of constant manpower, from penalties alone (goalie
      pulls left out): when it starts and ends, and each team's skaters. The same skater
      rule as int_shots_enriched, on clock time. A penalty stops at its time, at the
      power-play goal that ended it, or at the end of the game: 3600 s, the overtime winner,
      or 3600 + regular_season_overtime_seconds before a shootout (docs/plans/metrics.md,
      step 4).
    config:
      tags: [metrics]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, start_game_seconds]
    columns:
      - name: duration_seconds
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: home_skaters
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3
                max_value: 5
      - name: away_skaters
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3
                max_value: 5

  - name: int_finishing_priors_estimated
    description: >
      One row per prior group: F and D (shooting: goals per xG) and G (goaltending: goals
      allowed per xG faced). The shrinkage prior for fct_player_seasons and
      fct_player_careers, a gamma-Poisson empirical Bayes estimate from regular-season
      player-seasons on shots at a goalie with xG (docs/plans/metrics.md, step 2).
    config:
      tags: [metrics]
    columns:
      - name: prior_group
        description: F or D (shooters by position that season), or G (goalies).
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: [F, D, G]
      - name: player_seasons
        description: Player-seasons the estimate comes from.
      - name: prior_goals_per_xg
        description: >
          The group average m: goals / xG for shooters, goals allowed / xG faced for goalies,
          pooled over all its player-seasons.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: skill_variance
        description: >
          tau^2, the spread of players' multipliers on xG beyond Poisson noise. Zero or
          negative means the data can't tell players apart.
      - name: prior_xg
        description: >
          alpha = m / tau^2: how many expected goals of average finishing (or goaltending)
          the prior is worth. A player with this much xG of their own keeps half their
          record. Null when skill_variance is zero or negative: everyone in the group is
          shrunk fully to the average.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

unit_tests:
  - name: int_shots_enriched_measures_shots_in_feet
    description: >
      Turns shots toward the right-hand net and measures them in feet. Shots at a goalie go
      to the nearer net. Empty-net goals, flagged on the goal event even when the shot names
      a goalie, go to the end the team attacked that period, from its other shots, or
      home-attacks-left when it has none. Game 1 is drawn the usual
      way; game 2, period 1 has the ends swapped, as some periods are in the real data.
    model: int_shots_enriched
    given:
      - input: ref('stg_pwhl__shots')
        rows:
          # Away shot in the faceoff circle.
          - {game_id: 1, event_index: 1, period: 1, shooting_team_id: 20, is_home_team: false,
             goalie_player_id: 5, shot_result: on_net, x_location: 466, y_location: 269}
          # The same spot from the other end, by the home team.
          - {game_id: 1, event_index: 2, period: 1, shooting_team_id: 10, is_home_team: true,
             goalie_player_id: 6, shot_result: on_net, x_location: 134, y_location: 31}
          # From behind the net.
          - {game_id: 1, event_index: 3, period: 1, shooting_team_id: 20, is_home_team: false,
             goalie_player_id: 5, shot_result: on_net, x_location: 590, y_location: 120}
          # Center ice.
          - {game_id: 1, event_index: 4, period: 2, shooting_team_id: 20, is_home_team: false,
             goalie_player_id: 5, shot_result: on_net, x_location: 300, y_location: 150}
          # Home empty-net goal from its own half; no other home shots that period. The
          # shot still names the pulled goalie, as most real ones do.
          - {game_id: 1, event_index: 5, period: 3, shooting_team_id: 10, is_home_team: true,
             goalie_player_id: 5, shot_result: goal, goal_id: 501, x_location: 450,
             y_location: 149}
          # Swapped period: the home team's shots at a goalie are on the right...
          - {game_id: 2, event_index: 1, period: 1, shooting_team_id: 10, is_home_team: true,
             goalie_player_id: 5, shot_result: on_net, x_location: 500, y_location: 150}
          - {game_id: 2, event_index: 2, period: 1, shooting_team_id: 10, is_home_team: true,
             goalie_player_id: 5, shot_result: on_net, x_location: 520, y_location: 140}
          # ...so its empty-net goal from the left half goes to the right net.
          - {game_id: 2, event_index: 3, period: 1, shooting_team_id: 10, is_home_team: true,
             goalie_player_id: null, shot_result: goal, goal_id: 502, x_location: 150,
             y_location: 150}
      - input: ref('stg_pwhl__goals')
        rows:
          - {game_id: 1, event_index: 6, goal_id: 501, scoring_team_id: 10, is_empty_net: true}
          - {game_id: 2, event_index: 4, goal_id: 502, scoring_team_id: 10, is_empty_net: true}
      - input: ref('stg_pwhl__games')
        rows:
          - {game_id: 1, home_team_id: 10, away_team_id: 20}
          - {game_id: 2, home_team_id: 10, away_team_id: 20}
      - input: ref('stg_pwhl__seasons')
        rows: []
      - input: ref('int_penalties_timed')
        rows: []
      - input: ref('stg_pwhl__goalie_changes')
        rows: []
    expect:
      rows:
        - {game_id: 1, event_index: 1, is_empty_net: false,
           x_ft: 55.3, y_ft: -33.7, distance_ft: 47.6, angle_deg: 45.0}
        - {game_id: 1, event_index: 2, is_empty_net: false,
           x_ft: 55.3, y_ft: -33.7, distance_ft: 47.6, angle_deg: 45.0}
        - {game_id: 1, event_index: 3, is_empty_net: false,
           x_ft: 96.7, y_ft: 8.5, distance_ft: 11.4, angle_deg: 132.0}
        - {game_id: 1, event_index: 4, is_empty_net: false,
           x_ft: 0.0, y_ft: 0.0, distance_ft: 89.0, angle_deg: 0.0}
        - {game_id: 1, event_index: 5, is_empty_net: true,
           x_ft: -50.0, y_ft: -0.3, distance_ft: 139.0, angle_deg: 0.1}
        - {game_id: 2, event_index: 1, is_empty_net: false,
           x_ft: 66.7, y_ft: 0.0, distance_ft: 22.3, angle_deg: 0.0}
        - {game_id: 2, event_index: 2, is_empty_net: false,
           x_ft: 73.3, y_ft: 2.8, distance_ft: 15.9, angle_deg: 10.3}
        - {game_id: 2, event_index: 3, is_empty_net: true,
           x_ft: -50.0, y_ft: 0.0, distance_ft: 139.0, angle_deg: 0.0}

  - name: int_shots_enriched_counts_skaters
    description: >
      Skaters per side at each shot, from penalties and goalie pulls. Game 1 is a regular
      season game: a power play, then the goal that ends it; three penalties at once still
      leave 3 skaters; coincidental minors give 4-on-4; a pulled goalie gives 6v5 (strength
      group en) until a save shows the goalie back; an overtime penalty turns 3-on-3 into
      4v3. Game 2 is a
      preseason game whose overtime is 3-on-3; game 3 is a playoff game whose overtime is
      5-on-5, so a penalty gives 5v4.
    model: int_shots_enriched
    given:
      - input: ref('stg_pwhl__shots')
        rows:
          # Home power play.
          - {game_id: 1, season_id: 1, event_index: 10, period: 1, game_seconds: 100,
             shooting_team_id: 10, is_home_team: true, goalie_player_id: 5,
             shot_result: on_net, x_location: 500, y_location: 150}
          # After the power-play goal at event 11 ended the penalty.
          - {game_id: 1, season_id: 1, event_index: 12, period: 1, game_seconds: 140,
             shooting_team_id: 10, is_home_team: true, goalie_player_id: 5,
             shot_result: on_net, x_location: 500, y_location: 150}
          # Away team with three players in the box.
          - {game_id: 1, season_id: 1, event_index: 20, period: 1, game_seconds: 200,
             shooting_team_id: 20, is_home_team: false, goalie_player_id: 6,
             shot_result: on_net, x_location: 100, y_location: 150}
          # Coincidental minors.
          - {game_id: 1, season_id: 1, event_index: 30, period: 1, game_seconds: 400,
             shooting_team_id: 10, is_home_team: true, goalie_player_id: 5,
             shot_result: on_net, x_location: 500, y_location: 150}
          # Home goalie pulled late in the third.
          - {game_id: 1, season_id: 1, event_index: 50, period: 3, game_seconds: 3500,
             shooting_team_id: 10, is_home_team: true, goalie_player_id: 5,
             shot_result: on_net, x_location: 500, y_location: 150}
          # The away team's shot is saved: the home goalie is back, though no change was
          # recorded, so the home team's next shot is 5v5 again.
          - {game_id: 1, season_id: 1, event_index: 52, period: 3, game_seconds: 3510,
             shooting_team_id: 20, is_home_team: false, goalie_player_id: 6,
             shot_result: on_net, x_location: 100, y_location: 150}
          - {game_id: 1, season_id: 1, event_index: 54, period: 3, game_seconds: 3520,
             shooting_team_id: 10, is_home_team: true, goalie_player_id: 5,
             shot_result: on_net, x_location: 500, y_location: 150}
          # Overtime penalty to the away team.
          - {game_id: 1, season_id: 1, event_index: 60, period: 4, game_seconds: 3700,
             shooting_team_id: 10, is_home_team: true, goalie_player_id: 5,
             shot_result: on_net, x_location: 500, y_location: 150}
          # Preseason overtime is 3-on-3 too.
          - {game_id: 2, season_id: 2, event_index: 10, period: 4, game_seconds: 3700,
             shooting_team_id: 10, is_home_team: true, goalie_player_id: 5,
             shot_result: on_net, x_location: 500, y_location: 150}
          # Playoff overtime is 5-on-5, and a penalty takes a skater off as in regulation.
          - {game_id: 3, season_id: 3, event_index: 10, period: 4, game_seconds: 3700,
             shooting_team_id: 10, is_home_team: true, goalie_player_id: 5,
             shot_result: on_net, x_location: 500, y_location: 150}
      - input: ref('stg_pwhl__goals')
        rows:
          - {game_id: 1, event_index: 11, goal_id: 1, scoring_team_id: 10, is_empty_net: false}
      - input: ref('stg_pwhl__games')
        rows:
          - {game_id: 1, home_team_id: 10, away_team_id: 20}
          - {game_id: 2, home_team_id: 10, away_team_id: 20}
          - {game_id: 3, home_team_id: 10, away_team_id: 20}
      - input: ref('stg_pwhl__seasons')
        rows:
          - {season_id: 1, season_type: regular}
          - {season_id: 2, season_type: preseason}
          - {season_id: 3, season_type: playoffs}
      - input: ref('int_penalties_timed')
        rows:
          - {game_id: 1, penalty_id: 1, penalized_team_id: 20, start_event_index: 5,
             start_game_seconds: 50, end_game_seconds: 170, ended_by_goal_event_index: 11}
          - {game_id: 1, penalty_id: 2, penalized_team_id: 20, start_event_index: 15,
             start_game_seconds: 150, end_game_seconds: 270}
          - {game_id: 1, penalty_id: 3, penalized_team_id: 20, start_event_index: 16,
             start_game_seconds: 160, end_game_seconds: 280}
          - {game_id: 1, penalty_id: 4, penalized_team_id: 20, start_event_index: 17,
             start_game_seconds: 165, end_game_seconds: 285}
          - {game_id: 1, penalty_id: 5, penalized_team_id: 10, start_event_index: 25,
             start_game_seconds: 380, end_game_seconds: 500}
          - {game_id: 1, penalty_id: 6, penalized_team_id: 20, start_event_index: 26,
             start_game_seconds: 380, end_game_seconds: 500}
          - {game_id: 1, penalty_id: 7, penalized_team_id: 20, start_event_index: 55,
             start_game_seconds: 3650, end_game_seconds: 3770}
          - {game_id: 3, penalty_id: 8, penalized_team_id: 20, start_event_index: 5,
             start_game_seconds: 3650, end_game_seconds: 3770}
      - input: ref('stg_pwhl__goalie_changes')
        rows:
          - {game_id: 1, event_index: 45, period: 3, team_id: 10, goalie_in_player_id: null}
    expect:
      rows:
        - {game_id: 1, event_index: 10, skaters_for: 5, skaters_against: 4, strength_state: 5v4,
           strength_group: pp}
        - {game_id: 1, event_index: 12, skaters_for: 5, skaters_against: 5, strength_state: 5v5,
           strength_group: ev}
        - {game_id: 1, event_index: 20, skaters_for: 3, skaters_against: 5, strength_state: 3v5,
           strength_group: pk}
        - {game_id: 1, event_index: 30, skaters_for: 4, skaters_against: 4, strength_state: 4v4,
           strength_group: ev}
        - {game_id: 1, event_index: 50, skaters_for: 6, skaters_against: 5, strength_state: 6v5,
           strength_group: en}
        - {game_id: 1, event_index: 52, skaters_for: 5, skaters_against: 5, strength_state: 5v5,
           strength_group: ev}
        - {game_id: 1, event_index: 54, skaters_for: 5, skaters_against: 5, strength_state: 5v5,
           strength_group: ev}
        - {game_id: 1, event_index: 60, skaters_for: 4, skaters_against: 3, strength_state: 4v3,
           strength_group: pp}
        - {game_id: 2, event_index: 10, skaters_for: 3, skaters_against: 3, strength_state: 3v3,
           strength_group: ev}
        - {game_id: 3, event_index: 10, skaters_for: 5, skaters_against: 4, strength_state: 5v4,
           strength_group: pp}

  - name: int_penalties_timed_ends_and_stacks_penalties
    description: >
      A power-play goal ends a minor; a major and coincidental minors run their full time;
      a double minor runs back to back, the goal in its first half starting the second;
      two goals on a 5-on-3 end both minors; a major without the pp flag still counts;
      misconducts, penalty-shot penalties, fighting majors and coincidental minors called
      with a power-play minor are dropped.
    model: int_penalties_timed
    given:
      - input: ref('stg_pwhl__penalties')
        rows:
          - {game_id: 1, event_index: 10, game_seconds: 100, penalty_id: 1,
             penalized_team_id: 20, penalized_player_id: 1, penalty_class: Minor,
             penalty_minutes: 2.00, is_power_play_penalty: true, is_penalty_shot: false}
          - {game_id: 1, event_index: 20, game_seconds: 300, penalty_id: 2,
             penalized_team_id: 20, penalized_player_id: 2, penalty_class: Major,
             penalty_minutes: 5.00, is_power_play_penalty: true, is_penalty_shot: false}
          - {game_id: 1, event_index: 30, game_seconds: 700, penalty_id: 3,
             penalized_team_id: 10, penalized_player_id: 3, penalty_class: Minor,
             penalty_minutes: 2.00, is_power_play_penalty: false, is_penalty_shot: false}
          - {game_id: 1, event_index: 31, game_seconds: 700, penalty_id: 4,
             penalized_team_id: 20, penalized_player_id: 4, penalty_class: Minor,
             penalty_minutes: 2.00, is_power_play_penalty: false, is_penalty_shot: false}
          # Double minor: two 2-minute minors on player 7 at once.
          - {game_id: 1, event_index: 40, game_seconds: 1000, penalty_id: 5,
             penalized_team_id: 20, penalized_player_id: 7, penalty_class: Minor,
             penalty_minutes: 2.00, is_power_play_penalty: true, is_penalty_shot: false}
          - {game_id: 1, event_index: 41, game_seconds: 1000, penalty_id: 6,
             penalized_team_id: 20, penalized_player_id: 7, penalty_class: Minor,
             penalty_minutes: 2.00, is_power_play_penalty: true, is_penalty_shot: false}
          # 5-on-3.
          - {game_id: 1, event_index: 50, game_seconds: 1500, penalty_id: 7,
             penalized_team_id: 20, penalized_player_id: 8, penalty_class: Minor,
             penalty_minutes: 2.00, is_power_play_penalty: true, is_penalty_shot: false}
          - {game_id: 1, event_index: 51, game_seconds: 1510, penalty_id: 8,
             penalized_team_id: 20, penalized_player_id: 9, penalty_class: Minor,
             penalty_minutes: 2.00, is_power_play_penalty: true, is_penalty_shot: false}
          # Dropped.
          - {game_id: 1, event_index: 60, game_seconds: 2000, penalty_id: 9,
             penalized_team_id: 20, penalized_player_id: 1, penalty_class: Misconduct,
             penalty_minutes: 10.00, is_power_play_penalty: true, is_penalty_shot: false}
          - {game_id: 1, event_index: 61, game_seconds: 2100, penalty_id: 10,
             penalized_team_id: 20, penalized_player_id: 1, penalty_class: Minor,
             penalty_minutes: 2.00, is_power_play_penalty: true, is_penalty_shot: true}
          # A fight: majors on both teams at once are replaced on the ice.
          - {game_id: 1, event_index: 62, game_seconds: 2200, penalty_id: 11,
             penalized_team_id: 20, penalized_player_id: 1, penalty_class: Major,
             penalty_minutes: 5.00, is_power_play_penalty: false, is_penalty_shot: false}
          - {game_id: 1, event_index: 63, game_seconds: 2200, penalty_id: 15,
             penalized_team_id: 10, penalized_player_id: 5, penalty_class: Major,
             penalty_minutes: 5.00, is_power_play_penalty: false, is_penalty_shot: false}
          # A major with a game misconduct and no pp flag still counts.
          - {game_id: 1, event_index: 70, game_seconds: 2400, penalty_id: 16,
