version: 2

models:
  - name: int_shots_enriched
    description: >
      Shot attempts with xG context: coordinates rotated so every shot attacks the net at
      x = rink_net_x, approximate distance (ft) and angle to the net, score state before the
      shot, and time since the team's previous unblocked shot. Rink scale is approximate
      (see vars in dbt_project.yml).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, event_index]
    columns:
      - name: defending_team_id
        data_tests: [not_null]
      - name: distance_ft
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 220
      - name: angle_deg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 180
