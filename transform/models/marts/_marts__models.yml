version: 2

models:
  - name: dim_teams
    description: >
      One row per team (placeholders excluded), with its most recent name, code, and logo.
    columns:
      - name: league_id
        description: "{{ doc('league_id') }}"
      - name: team_id
        description: "{{ doc('team_id') }}"
        data_tests: [unique, not_null]
      - name: team_code
        description: Most recent team code.
      - name: team_name
        description: Most recent team name.
        data_tests: [not_null]
      - name: city
        description: Most recent city. Null when the API leaves it blank.
      - name: nickname
        description: Most recent nickname. Null when the API leaves it blank.
      - name: conference_name
        description: Most recent conference. HockeyTech calls conferences "divisions".
      - name: logo_url
        description: Most recent logo.
      - name: first_season_id
        description: "{{ doc('first_season_id') }}"
      - name: last_season_id
        description: "{{ doc('last_season_id') }}"
      - name: seasons_listed
        description: Number of seasons the team appears in the league's team list.

  - name: dim_players
    description: >
      One row per player who has appeared on a roster, with attributes from their most
      recent roster entry and career span.
    data_tests:
      # The same person under two player_ids would show up as a repeated name + birth date.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [full_name, birth_date]
          config:
            severity: warn
    columns:
      - name: league_id
        description: "{{ doc('league_id') }}"
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_tests: [unique, not_null]
      - name: first_name
        description: Most recent first name.
      - name: last_name
        description: Most recent last name.
      - name: full_name
        description: Most recent full name, as the API formats it.
        data_tests: [not_null]
      - name: position
        description: "{{ doc('position') }}"
      - name: position_group
        description: "{{ doc('position_group') }}"
      - name: shoots
        description: Handedness as the API reports it. Null when blank.
      - name: birth_date
        description: Null when blank or not a valid date.
      - name: birth_city
        description: Null when blank.
      - name: birth_region
        description: Province or state.
      - name: birth_country
        description: Country as the API reports it. Null when blank.
      - name: height_inches
        description: Parsed from the API's free-text height. Null when blank or unparseable.
      - name: headshot_url
        description: Most recent headshot. Null when blank.
      - name: first_season_id
        description: "{{ doc('first_season_id') }}"
      - name: last_season_id
        description: "{{ doc('last_season_id') }}"
      - name: seasons_on_roster
        description: >
          Number of seasons on any roster. Preseason, regular season, and playoffs count
          separately.
      - name: teams_played_for
        description: Number of different teams rostered on.

  - name: fct_player_team_seasons
    description: >
      One row per player per team per season rostered. A mid-season trade gives two rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_id, team_id, season_id]
    columns:
      - name: league_id
        description: "{{ doc('league_id') }}"
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: team_id
        description: "{{ doc('team_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: season_id
        description: "{{ doc('season_id') }}"
      - name: season_type
        description: "{{ doc('season_type') }}"
      - name: team_code
        description: "{{ doc('team_code') }}"
      - name: team_name
        description: "{{ doc('team_name') }}"
      - name: jersey_number
        description: Jersey number on that team that season.
      - name: position
        description: "{{ doc('position') }}"
      - name: position_group
        description: "{{ doc('position_group') }}"
      - name: is_rookie
        description: The league's rookie flag for that season.
      - name: roster_status
        description: Roster status as the API reports it. Null when blank.

  - name: fct_games
    description: >
      One row per game, played or scheduled. Team names are as of that season. Shootouts
      come from shootout attempts, not the schedule's unreliable flag.
    columns:
      - name: league_id
        description: "{{ doc('league_id') }}"
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_tests: [unique, not_null]
      - name: season_id
        description: "{{ doc('season_id') }}"
      - name: season_type
        description: "{{ doc('season_type') }}"
      - name: game_date
        description: Date played, as the schedule lists it.
      - name: scheduled_start_at
        description: Scheduled start, from the schedule's ISO 8601 time.
      - name: attendance
        description: Null when not reported.
      - name: is_final
        description: The game has been played and its result is final.
      - name: home_team_id
        description: "{{ doc('team_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: home_team_code
        description: "{{ doc('team_code') }}"
      - name: home_team_name
        description: "{{ doc('team_name') }}"
      - name: away_team_id
        description: "{{ doc('team_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: away_team_code
        description: "{{ doc('team_code') }}"
      - name: away_team_name
        description: "{{ doc('team_name') }}"
      - name: home_goals
        description: Final score. Null until final. Includes the +1 for a shootout win.
      - name: away_goals
        description: Final score. Null until final. Includes the +1 for a shootout win.
      - name: winning_team_id
        description: Null until final.
        data_tests:
          - not_null:
              config:
                where: is_final
      - name: decision
        description: regulation, overtime, or shootout. Null until final.
        data_tests:
          - accepted_values:
              arguments:
                values: [regulation, overtime, shootout]
          - not_null:
              config:
                where: is_final
      - name: has_overtime
        description: The schedule's overtime flag.
      - name: has_shootout
        description: True when play-by-play has shootout attempts for the game.
      - name: shootout_winning_team_id
        description: >
          Team that scored the shootout winner. Null without a shootout. Must agree with
          the final score.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= winning_team_id"
              config:
                where: has_shootout
      - name: home_shots_on_goal
        description: >
          Shots on goal (on net plus goals) from play-by-play. Null when the game has no
          play-by-play or the team recorded no shot attempts.
      - name: away_shots_on_goal
        description: Same as home_shots_on_goal, for the away team.
      - name: home_shot_attempts
        description: >
          Shots on goal plus blocked shots from play-by-play. The API doesn't record missed
          shots. Null like home_shots_on_goal.
      - name: away_shot_attempts
        description: Same as home_shot_attempts, for the away team.

  - name: fct_shots
    description: >
      One row per recorded shot attempt (on net, goal, blocked) with xG context and xG.
      The API does not record missed shots. Distances are approximate.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, event_index]
    columns:
      - name: league_id
        description: "{{ doc('league_id') }}"
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_games')
                field: game_id
      - name: event_index
        description: "{{ doc('event_index') }}"
      - name: season_id
        description: "{{ doc('season_id') }}"
      - name: season_type
        description: "{{ doc('season_type') }}"
      - name: period
        description: "{{ doc('period') }}"
      - name: period_seconds
        description: "{{ doc('period_seconds') }}"
      - name: game_seconds
        description: "{{ doc('game_seconds') }}"
      - name: shooter_player_id
        description: Warns if a shooter never appears on a roster.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
              config:
                severity: warn
      - name: shooting_team_id
        description: "{{ doc('team_id') }}"
      - name: defending_team_id
        description: The other team in the game.
      - name: is_home_team
        description: The shooting team is the home team.
      - name: goalie_player_id
        description: >
          Goalie the shot was against, as recorded on the shot. Empty-net goals usually still
          name the pulled goalie, so use is_empty_net to find them.
      - name: is_empty_net
        description: >
          The shot was a goal into an empty net, from the league's own flag on the goal.
          False for every other shot: a shot on goal at an empty net always scores.
      - name: blocker_player_id
        description: Player who blocked the shot. Null unless blocked.
      - name: shot_result
        description: on_net, goal, or blocked.
      - name: is_goal
        description: The shot was a goal.
      - name: is_unblocked
        description: On net or a goal.
      - name: goal_id
        description: The goal this shot produced, in stg_pwhl__goals. Null unless a goal.
      - name: shot_type
        description: Shot type as the API describes it (wrist, slap, ...).
      - name: is_quality_chance
        description: The league's own "quality chance" flag.
      - name: x_location
        description: 0-600 along the rink, as recorded.
      - name: y_location
        description: 0-300 across the rink, as recorded.
      - name: x_ft
        description: >
          Approximate feet from center ice along the rink, turned so every shot attacks the
          net at +89 ft. With y_ft, plots on a standard 200 x 85 ft rink centered at (0, 0).
      - name: y_ft
        description: >
          Approximate feet from center ice across the rink (-42.5 to 42.5), turned with x_ft.
      - name: distance_ft
        description: >
          Approximate distance to the net, in feet. Shots at a goalie are measured to the
          nearer net; empty-net shots to the end the team attacked that period.
      - name: angle_deg
        description: >
          Angle to the net: 0 straight on, 90 from the goal line, over 90 from behind it.
      - name: goals_for_before
        description: Goals the shooting team scored earlier in the game.
      - name: goals_against_before
        description: Goals the defending team scored earlier in the game.
      - name: score_diff
        description: goals_for_before minus goals_against_before.
      - name: seconds_since_team_prev_shot
        description: >
          Seconds since the shooting team's previous unblocked shot in the same period.
          Null for the team's first in the period.
      - name: is_rebound
        description: >
          Within rebound_window_seconds (3, in dbt_project.yml) of the same team's previous
          unblocked shot in the period.
      - name: skaters_for
        description: >
          Skaters (not goalies) the shooting team had on the ice, rebuilt from penalties and
          goalie pulls: 3 to 5, or 6 with its goalie pulled. Approximate; see
          docs/plans/xg-model.md, step 2.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3
                max_value: 6
      - name: skaters_against
        description: Skaters the defending team had on the ice, counted the same way.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3
                max_value: 6
      - name: strength_state
        description: >
          skaters_for v skaters_against, from the shooting team's side: '5v5', '5v4' on a
          power play, '4v5' short-handed, '6v5' with its goalie pulled.
        data_tests: [not_null]
      - name: xg
        description: >
          Expected goals: the chance this shot became a goal, from the xG model named by
          the xg_model_version var, rescaled so each season's total tracks its goals to
          date. Null for blocked, empty-net and preseason shots, and for new shots until
          the next scoring run (docs/plans/xg-model.md, steps 6 and 7).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: xg_raw
        description: >
          The same model's chance before rescaling, kept so the rescaling can be checked
          or undone.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: fct_goalie_games
    description: >
      One row per goalie per game played (started, came in, or faced a shot), regular season
      and playoffs, with goals saved above expected (GSAx). Counts cover shots on goal at the
      goalie that have xG: no empty-net goals, penalty shots, or shootout attempts, and no
      shots still waiting for the next xG scoring run (docs/plans/metrics.md, step 1).
    config:
      tags: [metrics]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, player_id]
    columns:
      - name: league_id
        description: "{{ doc('league_id') }}"
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_games')
                field: game_id
      - name: player_id
        description: The goalie. Warns if the goalie never appears on a roster.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
              config:
                severity: warn
      - name: season_id
        description: "{{ doc('season_id') }}"
      - name: season_type
        description: regular or playoffs. Preseason has no xG, so it's left out.
        data_tests:
          - accepted_values:
              arguments:
                values: [regular, playoffs]
      - name: game_date
        description: Date played, as the schedule lists it.
      - name: team_id
        description: The goalie's team in this game.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: opponent_team_id
        description: The other team in the game.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: is_home_team
        description: The goalie's team is the home team.
      - name: is_starter
        description: The first goalie in net for the team, from the goalie changes.
      - name: shots_faced
        description: >
          Shots on goal at this goalie that have xG. Shots name the goalie in net, so a
          mid-game change splits the game's shots between the two goalies.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: goals_allowed
        description: Goals among those shots.
        data_tests: [not_null]
      - name: xg_faced
        description: >
          Sum of xG on those shots, using the published (rescaled) xG from fct_shots, so a
          shift in the league's goal rate doesn't move every goalie (docs/plans/xg-model.md,
          decision 5).
        data_tests: [not_null]
      - name: gsax
        description: >
          Goals saved above expected: xg_faced minus goals_allowed. Positive means fewer goals
          allowed than an average goalie would on the same shots.
      - name: gsax_per_100_shots
        description: >
          GSAx per 100 shots faced. Per 100 rather than per shot only so the numbers are
          readable (per shot they are around 0.01). Null with no shots faced.

  - name: fct_player_seasons
    description: >
      One row per player per season (regular season and playoffs) with a shot at a goalie
      or a game in net: finishing (goals minus xG, raw and shrunk) and goaltending (GSAx,
      raw and shrunk). Shooting counts are 0 for goalies who never shot; goaltending columns
      are null for skaters (docs/plans/metrics.md, steps 1 and 2).
    config:
      tags: [metrics]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_id, season_id]
    columns:
      - name: league_id
        description: "{{ doc('league_id') }}"
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
              config:
                severity: warn
      - name: season_id
        description: "{{ doc('season_id') }}"
        data_tests: [not_null]
      - name: season_type
        description: regular or playoffs. Preseason has no xG, so it's left out.
        data_tests:
          - accepted_values:
              arguments:
                values: [regular, playoffs]
      - name: position_group
        description: >
          F, D or G, from that season's roster (latest position if not on one). Decides the
          shrinkage prior.
      - name: shots_on_goal
        description: "{{ doc('scored_shots_on_goal') }}"
        data_tests: [not_null]
      - name: goals
        description: "{{ doc('finishing_goals') }}"
        data_tests: [not_null]
      - name: xg
        description: Sum of xG on those shots.
        data_tests: [not_null]
      - name: goals_above_expected
        description: "{{ doc('goals_above_expected') }}"
      - name: goals_above_expected_shrunk
        description: "{{ doc('goals_above_expected_shrunk') }}"
      - name: shrinkage_weight
        description: "{{ doc('shrinkage_weight') }}"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: goalie_games
        description: "{{ doc('goalie_games') }}"
      - name: shots_faced
        description: "{{ doc('scored_shots_on_goal') }} Null for players who never played in net."
      - name: goals_allowed
        description: Goals among the shots faced.
      - name: xg_faced
        description: Sum of xG on the shots faced.
      - name: gsax
        description: "{{ doc('gsax') }}"
      - name: gsax_per_100_shots
        description: GSAx per 100 shots faced. Null with no shots faced.
      - name: gsax_shrunk
        description: "{{ doc('gsax_shrunk') }}"
      - name: goalie_shrinkage_weight
        description: "{{ doc('goalie_shrinkage_weight') }}"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: fct_player_careers
    description: >
      One row per player per season type: career regular season and career playoffs. The
      season rows of fct_player_seasons summed, with shrinkage redone on the career totals
      (shrunk values can't be summed across seasons).
    config:
      tags: [metrics]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_id, season_type]
    columns:
      - name: league_id
        description: "{{ doc('league_id') }}"
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
              config:
                severity: warn
      - name: season_type
        description: regular or playoffs.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [regular, playoffs]
      - name: position_group
        description: F, D or G, from the player's most recent season.
      - name: seasons_played
        description: Seasons of this type with a shot at a goalie or a game in net.
      - name: shots_on_goal
        description: "{{ doc('scored_shots_on_goal') }}"
        data_tests: [not_null]
      - name: goals
        description: "{{ doc('finishing_goals') }}"
        data_tests: [not_null]
      - name: xg
        description: Sum of xG on those shots.
        data_tests: [not_null]
      - name: goals_above_expected
        description: "{{ doc('goals_above_expected') }}"
      - name: goals_above_expected_shrunk
        description: "{{ doc('goals_above_expected_shrunk') }}"
      - name: shrinkage_weight
        description: "{{ doc('shrinkage_weight') }}"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: goalie_games
        description: "{{ doc('goalie_games') }}"
      - name: shots_faced
        description: "{{ doc('scored_shots_on_goal') }} Null for players who never played in net."
      - name: goals_allowed
        description: Goals among the shots faced.
      - name: xg_faced
        description: Sum of xG on the shots faced.
      - name: gsax
        description: "{{ doc('gsax') }}"
      - name: gsax_per_100_shots
        description: GSAx per 100 shots faced. Null with no shots faced.
      - name: gsax_shrunk
        description: "{{ doc('gsax_shrunk') }}"
      - name: goalie_shrinkage_weight
        description: "{{ doc('goalie_shrinkage_weight') }}"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

unit_tests:
  - name: fct_goalie_games_credits_shots_and_starters
    description: >
      Home goalie 5 starts, is pulled, and goalie 7 comes in. Away goalie 6 starts; goalie
      8 faces a shot with no goalie change recorded and still gets a row. A blocked shot,
      an empty-net goal, an unscored shot and a preseason game are left out.
    model: fct_goalie_games
    given:
      - input: ref('fct_games')
        rows:
          - {game_id: 1, season_id: 1, season_type: regular, game_date: 2026-01-01,
             home_team_id: 10, away_team_id: 20}
          - {game_id: 2, season_id: 2, season_type: preseason, game_date: 2025-11-01,
             home_team_id: 10, away_team_id: 20}
      - input: ref('stg_pwhl__goalie_changes')
        rows:
          - {league_id: pwhl, game_id: 1, event_index: 0, team_id: 10, goalie_in_player_id: 5}
          - {league_id: pwhl, game_id: 1, event_index: 1, team_id: 20, goalie_in_player_id: 6}
          - {league_id: pwhl, game_id: 1, event_index: 50, team_id: 10,
             goalie_in_player_id: null}
          - {league_id: pwhl, game_id: 1, event_index: 60, team_id: 10, goalie_in_player_id: 7}
          - {league_id: pwhl, game_id: 2, event_index: 0, team_id: 10, goalie_in_player_id: 5}
      - input: ref('fct_shots')
        rows:
          - {league_id: pwhl, game_id: 1, event_index: 10, defending_team_id: 10,
             goalie_player_id: 5, is_unblocked: true, is_empty_net: false, is_goal: false,
             xg: 0.25}
          - {league_id: pwhl, game_id: 1, event_index: 11, defending_team_id: 10,
             goalie_player_id: 5, is_unblocked: true, is_empty_net: false, is_goal: true,
             xg: 0.25}
          - {league_id: pwhl, game_id: 1, event_index: 61, defending_team_id: 10,
             goalie_player_id: 7, is_unblocked: true, is_empty_net: false, is_goal: false,
             xg: 0.25}
          - {league_id: pwhl, game_id: 1, event_index: 12, defending_team_id: 20,
             goalie_player_id: 6, is_unblocked: true, is_empty_net: false, is_goal: true,
             xg: 0.5}
          - {league_id: pwhl, game_id: 1, event_index: 13, defending_team_id: 20,
             goalie_player_id: 8, is_unblocked: true, is_empty_net: false, is_goal: false,
             xg: 0.75}
          # Left out: blocked, empty-net goal, not yet scored.
          - {league_id: pwhl, game_id: 1, event_index: 14, defending_team_id: 20,
             goalie_player_id: 6, is_unblocked: false, is_empty_net: false, is_goal: false,
             xg: null}
          - {league_id: pwhl, game_id: 1, event_index: 55, defending_team_id: 10,
             goalie_player_id: 5, is_unblocked: true, is_empty_net: true, is_goal: true,
             xg: null}
          - {league_id: pwhl, game_id: 1, event_index: 15, defending_team_id: 20,
             goalie_player_id: 6, is_unblocked: true, is_empty_net: false, is_goal: true,
             xg: null}
    expect:
      rows:
