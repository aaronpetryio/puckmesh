# Runs the style guide's linters on staged files before each commit.
#   pip install pre-commit && pre-commit install    # once per clone
#   pre-commit run --all-files                       # whole repo, on demand
# CI runs the same hooks, so skipping them locally only delays the failure.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-lint
        files: ^transform/(models|tests|macros|analyses|snapshots)/

  # SQLFluff's AM06 catches `group by 1, 2` but not `group by all`.
  - repo: local
    hooks:
      - id: no-group-by-all
        name: "group by column names, not `all` (docs/style-guide/sql.md)"
        language: pygrep
        entry: "(?i)\\bgroup\\s+by\\s+all\\b"
        files: \.sql$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
