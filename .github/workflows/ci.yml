name: ci

# Checks every pull request. Branch protection on main requires all three jobs, so a
# PR merges only when lint, tests, and the dbt build pass. See docs/style-guide/workflow.md.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A new push to a PR cancels this job's run for the previous commit.
    concurrency:
      group: lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pre-commit
        run: pip install -r requirements-dev.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Ruff, SQLFluff, yamllint, and the other pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: test-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ml.txt -r requirements-dev.txt

      - name: pytest
        run: python -m pytest

  dbt:
    name: dbt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every PR builds into the same dev.ci_silver / dev.ci_gold schemas, so one at a time,
    # and a build is never cancelled halfway (a newer push waits for it instead).
    concurrency:
      group: dbt-ci
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      # Default (dev) target: reads the raw catalog, writes only dev.ci_*.
      DBT_SCHEMA: ci
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      # Pull requests from forks get no secrets. Fail rather than skip: a skipped job
      # counts as passing for branch protection, which would let an unbuilt PR merge.
      - name: Check Databricks secrets
        run: |
          for name in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_HTTP_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (a PR from a fork gets no secrets)."
              echo "Push the branch to this repo to build it."
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ml.txt

      # fct_shots reads dev.ml.xg_predictions; this creates it (empty) if it's missing.
      - name: xG predictions table (create if missing)
        run: python -m ml.xg setup --target dev

      - name: dbt build (dev, ci schemas)
        working-directory: transform
        run: |
          dbt deps
          dbt build

      - name: Keep dbt logs and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-ci-${{ github.run_id }}
          path: |
            transform/logs/
            transform/target/run_results.json
          retention-days: 14
          if-no-files-found: ignore
