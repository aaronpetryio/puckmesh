name: ci

# Checks every pull request. Branch protection on main requires all three jobs, so a
# PR merges only when lint, tests, and the dbt build pass. See docs/style-guide/workflow.md.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A new push to a PR cancels this job's run for the previous commit.
    concurrency:
      group: lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pre-commit
        run: pip install -r requirements-dev.txt

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Ruff, SQLFluff, yamllint, and the other pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: test-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: python -m pytest

  dbt:
    name: dbt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every PR builds into the same dev.ci_silver / dev.ci_gold schemas, so one at a time,
    # and a build is never cancelled halfway (a newer push waits for it instead).
    concurrency:
      group: dbt-ci
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      # Default (dev) target: reads the raw catalog, writes only dev.ci_*.
      DBT_SCHEMA: ci
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      # Pull requests from forks get no secrets. Fail rather than skip: a skipped job
      # counts as passing for branch protection, which would let an unbuilt PR merge.
      - name: Check Databricks secrets
        run: |
          for name in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_HTTP_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (a PR from a fork gets no secrets)."
              echo "Push the branch to this repo to build it."
              exit 1
            fi
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: dbt build (dev, ci schemas)
        working-directory: transform
        run: |
          dbt deps
          dbt build

      - name: Keep dbt logs and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dbt-ci-${{ github.run_id }}
          path: |
            transform/logs/
            transform/target/run_results.json
          retention-days: 14
          if-no-files-found: ignore
