# Keeps the SHA-pinned actions and the Python dependencies current, as pull requests.
# See docs/style-guide/workflow.md, "GitHub Actions".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # dbt-databricks caps these, and pip already installs the newest versions it allows.
      # Bumping them past the cap makes requirements.txt impossible to install (PR #7).
      - dependency-name: databricks-sdk
      - dependency-name: databricks-sql-connector
      - dependency-name: dbt-core
