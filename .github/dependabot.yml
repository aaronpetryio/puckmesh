# Keeps the SHA-pinned actions and the Python dependencies current, as pull requests.
# See docs/style-guide/workflow.md, "GitHub Actions".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
